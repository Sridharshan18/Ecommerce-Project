spring.application.name=user-service
spring.datasource.url=jdbc:mysql://localhost:3306/userdb
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8082

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3000
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*
management.tracing.sampling.probability=1.0

logging.file.name=logs/user-service.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7

keycloak.admin.username=user
keycloak.admin.password=user
keycloak.admin.server-url=http://localhost:8443
keycloak.admin.realm=ecom-app
keycloak.admin.client-id=admin-cli
keycloak.admin.client-uid=b9427164-8f8e-42c7-aecc-d5f06a524b51
